name: Build test on PR

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧹 Lint the code
        run: npm run lint

      - name: 🔧 Build the project
        run: npm run build
